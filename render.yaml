services:
  - type: web
    name: esim-hub-mcp
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py --server_type=sse --port $PORT
    healthCheckPath: /
    autoDeploy: true
    # Set your environment variables in the Render dashboard for secrets
    envVars:
      - key: ESIM_DIGITAL_SERVICE_URL
      - key: ESIM_MM_HUB_API_URL
      - key: ESIM_HUB_API_KEY
      - key: ESIM_HUB_TENANT_KEY
      - key: SMTP_SERVER
      - key: SMTP_PORT
      - key: SMTP_USE_TLS
      - key: SMTP_USERNAME
      - key: SMTP_PASSWORD
      - key: SMTP_SENDER
      - key: SMTP_SENDER_NAME

